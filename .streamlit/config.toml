[server]
# Raised for the 835 database upload: the schedule workbook and the
# remittance PDFs are small, but the .sqlite is not.
maxUploadSize = 10000

[browser]
# No usage telemetry leaves this app.
gatherUsageStats = false

[client]
# Raw tracebacks can contain cell values and patient names. Suppress them in
# the UI; the app catches exceptions and shows a generic message instead.
showErrorDetails = false

[logger]
# Keep the server log free of request-level detail.
level = "error"
